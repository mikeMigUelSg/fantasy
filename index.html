<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Liga dos Últimos — Classificação por Jornada</title>
<style>
  :root {
    --fundo: #f4f6f8;
    --painel: #ffffff;
    --texto: #1a2027;
    --suave: #6b7684;
    --linha: #d8dee6;
    --cabecalho: #fce7d2;
    --equipa: #e8e4dd;
    --celula: #dbe8f7;
    --total: #d8ecd9;
    --bom: #4caf50;
    --mau: #e8623c;
    --paga: #f8cfc4;      /* vermelho claro: os 4 piores da jornada */
    --destaque: #fff3bf;
    /* Cores do grafico, validadas para daltonismo e contraste nos dois temas. */
    --serie: #2a78d6;
    --serie-eu: #e34948;
    --grelha: #e1e0d9;
    --eixo: #c3c2b7;
    --tinta-2: #52514e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fundo: #14171c; --painel: #1c2027; --texto: #e6e9ed; --suave: #97a1ae;
      --linha: #2e343d; --cabecalho: #4a3826; --equipa: #2b2f36; --celula: #223047;
      --total: #24402a; --destaque: #4a4326;
      --paga: #5e2f26;
      --serie: #3987e5;
      --serie-eu: #e66767;
      --grelha: #2c2c2a;
      --eixo: #383835;
      --tinta-2: #c3c2b7;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 60px;
    background: var(--fundo); color: var(--texto);
    font-family: "Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .envolve { max-width: 1600px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--suave); font-size: .875rem; margin-bottom: 18px; }
  .barra { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
  button {
    font: inherit; font-size: .85rem; padding: 7px 14px; cursor: pointer;
    border: 1px solid var(--linha); border-radius: 7px;
    background: var(--painel); color: var(--texto);
  }
  button:hover:not(:disabled) { border-color: var(--suave); }
  button:disabled { opacity: .55; cursor: default; }
  button.ativo { background: var(--texto); color: var(--painel); border-color: var(--texto); }
  .estado { font-size: .8rem; color: var(--suave); }

  .painel {
    background: var(--painel); border: 1px solid var(--linha);
    border-radius: 10px; overflow: hidden;
  }
  /* A tabela e larga (34 jornadas): rola dentro do painel, nunca a pagina. */
  .rolar { overflow-x: auto; }
  table { border-collapse: separate; border-spacing: 0; font-size: .82rem; width: max-content; min-width: 100%; }
  th, td { border-right: 1px solid var(--linha); border-bottom: 1px solid var(--linha); padding: 7px 9px; text-align: center; white-space: nowrap; }
  thead th { background: var(--cabecalho); font-weight: 600; position: sticky; top: 0; z-index: 2; }

  /* Coluna da equipa fixa a esquerda, como no teu ficheiro. */
  .equipa-col { text-align: left; background: var(--equipa); position: sticky; left: 0; z-index: 1; min-width: 230px; font-weight: 500; }
  thead .equipa-col { z-index: 3; }
  .jogador { color: var(--suave); font-weight: 400; }

  td.jornada { background: var(--celula); font-variant-numeric: tabular-nums; }
  td.vazia { background: var(--celula); opacity: .45; }
  td.total { background: var(--total); font-weight: 700; font-variant-numeric: tabular-nums; }
  th.total-col { min-width: 64px; }
  tr.eu .equipa-col { background: var(--destaque); font-weight: 700; }

  /* Melhor e pior pontuacao de cada jornada, como no teu preenchimento. */
  td.melhor { background: var(--bom); color: #fff; font-weight: 700; }
  td.pior { background: var(--mau); color: #fff; font-weight: 700; }
  /* Os 4 piores da jornada -- vermelho claro. Sao os que pagam 1 EUR ao pote.
     O pior de todos leva o vermelho forte, por cima deste. */
  td.paga { background: var(--paga); }

  tfoot td { background: var(--equipa); font-weight: 700; }
  .legenda { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 14px; font-size: .78rem; color: var(--suave); }
  .chip { display: inline-flex; align-items: center; gap: 6px; }
  .quad { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .erro { padding: 12px 14px; border-radius: 8px; background: #fdecea; color: #8a2318; font-size: .85rem; margin-bottom: 14px; }
  @media (prefers-color-scheme: dark) { .erro { background: #3b1f1b; color: #f3b5a8; } }

  /* --- Pote ------------------------------------------------------------- */
  .pote {
    margin-top: 28px; padding: 22px 24px 24px;
    background: var(--painel); border: 1px solid var(--linha); border-radius: 10px;
  }
  .pote-rotulo { font-size: .82rem; color: var(--suave); text-transform: uppercase; letter-spacing: .06em; }
  /* Figura heroi: fonte do sistema, figuras proporcionais (nao tabular). */
  .pote-valor { font-size: 3rem; font-weight: 700; line-height: 1.1; margin-top: 2px; }
  .pote-nota { font-size: .85rem; color: var(--suave); margin-top: 4px; }
  .titulo-grafico { font-size: 1rem; margin: 26px 0 2px; }
  .nota-grafico { font-size: .82rem; color: var(--suave); margin: 0 0 14px; }

  /* Barras em HTML: uma grelha de [rotulo | barra | valor]. */
  .barras { display: grid; grid-template-columns: minmax(120px, 210px) 1fr auto; gap: 7px 12px; align-items: center; }
  .b-nome { font-size: .82rem; text-align: right; color: var(--tinta-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .b-carril { position: relative; height: 20px; }
  .b-barra {
    height: 100%; background: var(--serie);
    border-radius: 0 4px 4px 0;  /* topo arredondado, base ancorada no eixo */
    min-width: 2px; transition: width .18s ease;
  }
  .b-barra.eu { background: var(--serie-eu); }
  .b-valor { font-size: .82rem; font-variant-numeric: tabular-nums; color: var(--tinta-2); min-width: 74px; }
  .b-linha:hover .b-nome, .b-linha:hover .b-valor { color: var(--texto); }
  .vazio { color: var(--suave); font-size: .875rem; padding: 10px 0; }

  .tabela-alt { margin-top: 20px; }
  .tabela-alt summary { cursor: pointer; font-size: .82rem; color: var(--suave); }
  .tabela-alt summary:hover { color: var(--texto); }
  table.mini { margin-top: 10px; font-size: .82rem; }
  table.mini th, table.mini td { border-right: none; padding: 6px 14px 6px 0; text-align: left; background: none; }
  table.mini thead th { background: none; position: static; }
  table.mini .equipa-col { position: static; background: none; min-width: 0; }
</style>
</head>
<body>
<div class="envolve">
  <h1 id="titulo">Classificação por Jornada</h1>
  <div class="sub" id="subtitulo">a carregar…</div>

  <div class="barra">
    <button id="btn-total" class="ativo">Pontos por jornada</button>
    <button id="btn-acumulado">Total acumulado</button>
    <button id="btn-atualizar">Atualizar ao vivo</button>
    <span class="estado" id="estado"></span>
  </div>

  <div id="aviso"></div>

  <div class="painel">
    <div class="rolar">
      <table id="tabela">
        <thead><tr id="cabecalho"></tr></thead>
        <tbody id="corpo"></tbody>
        <tfoot id="rodape"></tfoot>
      </table>
    </div>
  </div>

  <div class="legenda">
    <span class="chip"><span class="quad" style="background:var(--bom)"></span> melhor da jornada</span>
    <span class="chip"><span class="quad" style="background:var(--mau)"></span> pior da jornada</span>
    <span class="chip"><span class="quad" style="background:var(--paga)"></span> 4 piores — pagam 1 € cada</span>
    <span class="chip"><span class="quad" style="background:var(--destaque)"></span> a tua equipa</span>
  </div>

  <section class="pote">
    <div class="pote-topo">
      <div>
        <div class="pote-rotulo">Pote Acumulado</div>
        <div class="pote-valor" id="pote-valor">— €</div>
        <div class="pote-nota" id="pote-nota"></div>
      </div>
    </div>

    <h2 class="titulo-grafico">Contribuição de cada um</h2>
    <p class="nota-grafico">
      Em cada jornada, os 4 piores classificados põem 1 € no pote.
    </p>
    <div id="grafico"></div>

    <details class="tabela-alt">
      <summary>Ver como tabela</summary>
      <div class="rolar">
        <table class="mini">
          <thead><tr><th class="equipa-col">Equipa</th><th>Jornadas pagas</th><th>Contribuição</th></tr></thead>
          <tbody id="corpo-pote"></tbody>
        </table>
      </div>
    </details>
  </section>
</div>

<script>
// A minha equipa, para ficar destacada na tabela.
const EU = 22441;

// Regras do pote: em cada jornada, os N piores poem 1 EUR cada.
const QUANTOS_PAGAM = 4;
const EUROS_POR_JORNADA = 1;

let dados = null;
let modo = "jornada"; // "jornada" = pontos da jornada, "acumulado" = total corrido

const $ = (id) => document.getElementById(id);

async function carregar(aoVivo) {
  const estado = $("estado");
  try {
    // Sem ?live, le o data.json embutido no deploy: mesma origem, sem CORS,
    // funciona mesmo que a funcao serverless falhe ou nao exista.
    const url = aoVivo ? `/api/standings?liga=1406` : `./data.json`;
    estado.textContent = aoVivo ? "a contactar a Liga…" : "";
    const resposta = await fetch(url, { cache: aoVivo ? "no-store" : "default" });
    if (!resposta.ok) throw new Error(`HTTP ${resposta.status}`);
    const json = await resposta.json();
    if (json.erro) throw new Error(json.erro);
    dados = json;
    $("aviso").innerHTML = "";
    desenhar();
    estado.textContent = aoVivo ? "dados ao vivo" : "";
  } catch (erro) {
    estado.textContent = "";
    if (aoVivo) {
      // Falhar o refresh nao pode partir a pagina: fica o que ja estava.
      $("aviso").innerHTML =
        `<div class="erro">Não foi possível ir buscar dados ao vivo (${erro.message}). ` +
        `A mostrar os dados do último deploy.</div>`;
    } else {
      $("aviso").innerHTML = `<div class="erro">Falha ao carregar data.json: ${erro.message}</div>`;
    }
  }
}

// Quem paga em cada jornada.
//
// Sao sempre exatamente 4 a pagar. Havendo empate na pontuacao da jornada, o
// desempate e pelo total acumulado da epoca: quem tem menos total fica mais
// abaixo, logo paga primeiro. Sem esta segunda chave a ordem dependeria da
// ordem de chegada dos dados, e o pote mudava sozinho entre atualizacoes.
function calcularPote(equipas, totalJornadas) {
  const porEquipa = new Map(equipas.map((e) => [e.id_equipa, 0]));
  const pagantesPorJornada = {};
  let total = 0;

  for (let j = 1; j <= totalJornadas; j++) {
    const jogaram = equipas.filter((e) => e.jornadas?.[j] != null);
    // Uma jornada so conta quando ha gente suficiente para formar o grupo.
    if (jogaram.length < QUANTOS_PAGAM) continue;

    const ordenado = [...jogaram].sort(
      (a, b) => a.jornadas[j].pontos - b.jornadas[j].pontos || a.total - b.total
    );
    const pagam = ordenado.slice(0, QUANTOS_PAGAM);
    pagantesPorJornada[j] = new Set(pagam.map((e) => e.id_equipa));
    for (const e of pagam) {
      porEquipa.set(e.id_equipa, porEquipa.get(e.id_equipa) + EUROS_POR_JORNADA);
      total += EUROS_POR_JORNADA;
    }
  }
  return { porEquipa, pagantesPorJornada, total };
}

function desenharPote(equipas, totalJornadas) {
  const { porEquipa, total } = calcularPote(equipas, totalJornadas);
  const jogadas = (dados.jornadas_terminadas || []).length;

  $("pote-valor").textContent = `${total} €`;
  $("pote-nota").textContent = jogadas
    ? `${QUANTOS_PAGAM} × ${EUROS_POR_JORNADA} € por jornada · ${jogadas} jornada${jogadas === 1 ? "" : "s"} jogada${jogadas === 1 ? "" : "s"}`
    : "Ainda não há jornadas jogadas.";

  // Ordena por contribuicao; so mostra quem ja pagou alguma coisa.
  const contribs = equipas
    .map((e) => ({ ...e, euros: porEquipa.get(e.id_equipa) || 0 }))
    .filter((e) => e.euros > 0)
    .sort((a, b) => b.euros - a.euros || a.equipa.localeCompare(b.equipa));

  if (!contribs.length) {
    $("grafico").innerHTML = '<div class="vazio">Ainda ninguém contribuiu para o pote.</div>';
    $("corpo-pote").innerHTML = "";
    return;
  }

  const maximo = Math.max(...contribs.map((c) => c.euros));
  $("grafico").innerHTML =
    '<div class="barras">' +
    contribs
      .map((c) => {
        const largura = (c.euros / maximo) * 100;
        const jornadasPagas = c.euros / EUROS_POR_JORNADA;
        const titulo = `${c.equipa} — ${c.euros} € em ${jornadasPagas} jornada(s)`;
        return (
          `<div class="b-linha" style="display:contents" title="${escapar(titulo)}">` +
          `<div class="b-nome">${escapar(c.equipa)}</div>` +
          `<div class="b-carril"><div class="b-barra${c.id_equipa === EU ? " eu" : ""}" style="width:${largura}%"></div></div>` +
          `<div class="b-valor">${c.euros} € · ${jornadasPagas}J</div>` +
          `</div>`
        );
      })
      .join("") +
    "</div>";

  $("corpo-pote").innerHTML = contribs
    .map(
      (c) =>
        `<tr><td class="equipa-col">${escapar(c.equipa)}</td>` +
        `<td>${c.euros / EUROS_POR_JORNADA}</td><td>${c.euros} €</td></tr>`
    )
    .join("");
}

function desenhar() {
  const totalJornadas = dados.total_jornadas || 34;
  const jogadas = new Set(dados.jornadas_terminadas || []);

  $("titulo").textContent = dados.nome_liga || "Classificação por Jornada";
  const quando = dados.atualizado_em
    ? new Date(dados.atualizado_em).toLocaleString("pt-PT")
    : "—";
  $("subtitulo").textContent =
    `${dados.equipas.length} equipas · ${jogadas.size} de ${totalJornadas} jornadas jogadas · atualizado ${quando}`;

  // Cabecalho: Equipa | J1..J34 | Total
  const cab = ['<th class="equipa-col">Equipa e Treinador</th>'];
  for (let j = 1; j <= totalJornadas; j++) cab.push(`<th>J${j}</th>`);
  cab.push('<th class="total-col">Total</th>');
  $("cabecalho").innerHTML = cab.join("");

  // Ordena pelo total, do melhor para o pior.
  const equipas = [...dados.equipas].sort((a, b) => b.total - a.total);

  // Melhor e pior de cada jornada, para colorir as celulas.
  const melhor = {}, pior = {};
  for (let j = 1; j <= totalJornadas; j++) {
    const valores = equipas
      .map((e) => e.jornadas?.[j]?.pontos)
      .filter((v) => typeof v === "number");
    if (valores.length > 1) {
      melhor[j] = Math.max(...valores);
      pior[j] = Math.min(...valores);
    }
  }

  // Quem paga em cada jornada -- a mesma conta que alimenta o pote, para a
  // tabela e o grafico nunca discordarem um do outro.
  const { pagantesPorJornada } = calcularPote(equipas, totalJornadas);

  const linhas = equipas.map((e) => {
    const cel = [
      `<td class="equipa-col">${escapar(e.equipa)} <span class="jogador">- ${escapar(e.jogador)}</span></td>`,
    ];
    for (let j = 1; j <= totalJornadas; j++) {
      const g = e.jornadas?.[j];
      if (!g) { cel.push('<td class="vazia"></td>'); continue; }
      const valor = modo === "jornada" ? g.pontos : g.total;
      let classe = "jornada";
      // So faz sentido destacar melhor/pior nos pontos da propria jornada.
      if (modo === "jornada" && melhor[j] !== undefined) {
        // Vermelho claro para os 4 que pagam; o pior de todos leva o vermelho
        // forte por cima, e o melhor da jornada leva verde.
        if (pagantesPorJornada[j]?.has(e.id_equipa)) classe = "paga";
        if (g.pontos === melhor[j]) classe = "melhor";
        else if (g.pontos === pior[j]) classe = "pior";
      }
      cel.push(`<td class="${classe}">${valor}</td>`);
    }
    cel.push(`<td class="total">${e.total}</td>`);
    return `<tr class="${e.id_equipa === EU ? "eu" : ""}">${cel.join("")}</tr>`;
  });
  $("corpo").innerHTML = linhas.join("");

  // Rodape: soma de todos os participantes por jornada.
  const rod = ['<td class="equipa-col">Total</td>'];
  for (let j = 1; j <= totalJornadas; j++) {
    const soma = equipas.reduce((t, e) => t + (e.jornadas?.[j]?.pontos || 0), 0);
    rod.push(`<td>${soma || ""}</td>`);
  }
  rod.push(`<td>${equipas.reduce((t, e) => t + e.total, 0)}</td>`);
  $("rodape").innerHTML = `<tr>${rod.join("")}</tr>`;

  desenharPote(equipas, totalJornadas);
}

function escapar(texto) {
  const d = document.createElement("div");
  d.textContent = texto ?? "";
  return d.innerHTML;
}

$("btn-total").onclick = () => {
  modo = "jornada";
  $("btn-total").classList.add("ativo");
  $("btn-acumulado").classList.remove("ativo");
  desenhar();
};
$("btn-acumulado").onclick = () => {
  modo = "acumulado";
  $("btn-acumulado").classList.add("ativo");
  $("btn-total").classList.remove("ativo");
  desenhar();
};
$("btn-atualizar").onclick = async (ev) => {
  ev.target.disabled = true;
  await carregar(true);
  ev.target.disabled = false;
};

carregar(false);
</script>
</body>
</html>
